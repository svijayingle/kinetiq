name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests and integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Run Ruff lint checks
        run: uv run ruff check .

      - name: Run tests and integration tests
        run: uv run pytest -q

      - name: Build package distributions
        run: uv build

      - name: Verify the built wheel installs
        run: |
          uv venv "$RUNNER_TEMP/kinetiq-wheel-env"
          uv pip install --python "$RUNNER_TEMP/kinetiq-wheel-env/bin/python" "$GITHUB_WORKSPACE"/dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/kinetiq-wheel-env/bin/python" -c "from kinetiq import create_app; assert create_app().title == 'KinetiQ'"
