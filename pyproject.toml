[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "kinetiq"
version = "0.1.0"
description = "A message queue engine implementing an SQS-style API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiosqlite",
    "fastapi",
    "pydantic",
    "uvicorn",
]

[dependency-groups]
dev = [
    "datamodel-code-generator",
    "httpx",
    "pytest",
]

[tool.uv]

[tool.hatch.build.targets.wheel]
packages = ["kinetiq"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]