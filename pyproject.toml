[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "kinetiq"
version = "0.1.0"
description = "A message queue engine implementing an SQS-style API"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ email = "svijayingle@gmail.com" }]
dependencies = [
    "aiosqlite==0.22.1",
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "datamodel-code-generator==0.83.0",
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[tool.uv]

[tool.hatch.build.targets.wheel]
packages = ["kinetiq"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
